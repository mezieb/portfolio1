name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This is the gate that would have caught the broken Phase 2 commit:
      # `tsc` fails hard on any type or syntax error before Vite ever runs.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          ls dist/assets/*.css >/dev/null || { echo "no CSS bundle emitted"; exit 1; }
          ls dist/assets/*.js  >/dev/null || { echo "no JS bundle emitted"; exit 1; }
          echo "Build output verified."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
