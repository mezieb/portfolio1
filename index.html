<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <!-- Meta Tags -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <!-- SEO Meta -->
  <title>Chimezie Bright — Full Stack Software Engineer</title>
  <meta name="description" content="Okoro Chimezie Bright, a professional Full Stack Software Engineer based in Vietnam. Build modern web applications with React, Next.js, Node.js, and more. View my project portfolio." />
  <meta name="keywords" content="software engineer, full stack developer, web developer, React, Next.js, Node.js, portfolio, frontend developer, backend developer, Docker" />
  <meta name="author" content="Okoro Chimezie Bright" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://webecomtech.com/" />
  <meta property="og:title" content="Chimezie Bright — Full Stack Software Engineer" />
  <meta property="og:description" content="Professional software engineer portfolio. Build modern web applications with React, Next.js, Node.js, and more." />
  <meta property="og:image" content="/social-preview.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://webecomtech.com/" />
  <meta name="twitter:title" content="Chimezie Bright — Full Stack Software Engineer" />
  <meta name="twitter:description" content="Professional software engineer portfolio. Build modern web applications with React, Next.js, Node.js, and more." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/img/logos/logo.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/logos/apple-touch-icon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <script type="module" src="/src/main.ts"></script>
</head>
<body class="bg-[var(--bg-primary)] text-[var(--text-primary)] dark">

  <!-- ========= Layout Shell ===== -->
  <div id="root-app">
    <!-- Header rendered by App.svelte equivalent, but in vanilla TS we do it manually -->
    <header id="main-header" class="fixed top-0 left-0 w-full z-50 transition-[background-color,border,color] duration-300 border-b border-transparent">
      <div class="container-custom h-16 flex items-center justify-between">

        <!-- Brand -->
        <a href="#hero" class="flex items-center gap-2 text-xl font-bold gradient-text">
          <span class="text-lg font-mono">&lt;</span>CB<span class="text-lg font-mono">/&gt;</span>
        </a>

        <!-- Desktop Nav -->
        <nav id="desktop-nav" class="hidden md:flex items-center gap-8">
          <a href="#about" class="text-sm text-[var(--text-secondary)] hover:text-[var(--accent)] transition-colors font-medium">About</a>
          <a href="#skills" class="text-sm text-[var(--text-secondary)] hover:text-[var(--accent)] transition-colors font-medium">Skills</a>
          <a href="#experience" class="text-sm text-[var(--text-secondary)] hover:text-[var(--accent)] transition-colors font-medium">Experience</a>
          <a href="#projects" class="text-sm text-[var(--text-secondary)] hover:text-[var(--accent)] transition-colors font-medium">Projects</a>
          <a href="#contact" class="text-sm text-[var(--text-secondary)] hover:text-[var(--accent)] transition-colors font-medium">Contact</a>

          <!-- Dark/Light Toggle -->
          <button id="theme-toggle" type="button" aria-label="Toggle theme" class="w-9 h-9 flex items-center justify-center rounded-full border border-[var(--border-color)] hover:border-[var(--accent)] transition-colors">
            ☾
          </button>

          <!-- CTA -->
          <a href="#contact" class="gradient-btn px-5 py-2 text-sm">Let's Talk</a>
        </nav>

        <!-- Mobile Menu Button -->
        <div class="md:hidden flex items-center gap-3">
          <button id="theme-toggle-mobile" type="button" aria-label="Toggle theme" class="w-9 h-9 flex items-center justify-center rounded-full border border-[var(--border-color)]">
            ☾
          </button>
          <button id="mobile-menu-btn" type="button" aria-label="Open menu" aria-expanded="false" class="w-10 h-10 flex flex-col items-center justify-center gap-[5px] rounded-lg border border-[var(--border-color)]">
            <span class="block w-5 h-[2px] bg-current transition-all duration-300 hamburger-bar"></span>
            <span class="block w-5 h-[2px] bg-current transition-all duration-300 hamburger-bar"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- Mobile Navigation Overlay -->
    <div id="mobile-nav" class="fixed inset-0 z-40 flex items-center justify-center bg-[var(--bg-primary)] dark:bg-opacity-95 transform translate-x-full transition-transform duration-300 md:hidden">
      <nav class="flex flex-col items-center gap-8">
        <a href="#about" class="text-2xl font-semibold text-[var(--text-secondary)] hover:text-[var(--accent)] transition-colors mobile-nav-link">About</a>
        <a href="#skills" class="text-2xl font-semibold text-[var(--text-secondary)] hover:text-[var(--accent)] transition-colors mobile-nav-link">Skills</a>
        <a href="#experience" class="text-2xl font-semibold text-[var(--text-secondary)] hover:text-[var(--accent)] transition-colors mobile-nav-link">Experience</a>
        <a href="#projects" class="text-2xl font-semibold text-[var(--text-secondary)] hover:text-[var(--accent)] transition-colors mobile-nav-link">Projects</a>
        <a href="#contact" class="text-2xl font-semibold text-[var(--text-secondary)] hover:text-[var(--accent)] transition-colors mobile-nav-link">Contact</a>
      </nav>
    </div>

    <!-- Main Content -->
    <main id="main-content">
      <!-- ===== Sections will be added in Phase 2 ===== -->
    </main>

    <!-- Footer rendered dynamically by JS -->
  </div>

</body>
</html>
